<style>
  :root {
    --clr-primary: #900; /* Springer/Nature red */
    --clr-bg-light: #fafafa;
    --clr-bg-hover: #f8f8f8;
    --clr-text: #333;
    --clr-border: #ccc;
    --clr-shadow: rgba(0, 0, 0, 0.05);
  }

  /* ===============================
     Searchbar Container
  =============================== */
  .searchbar-wrapper {
    width: 100%;
    max-width: 300px;
    margin: 0;
    padding: 0;
    position: relative;
    z-index: 1000;
  }

  .searchbar-wrapper input[type="text"],
  #search-input {
    width: 100%;
    padding: 0.6rem 1rem;
    font-size: 1rem;
    border: 0.5px solid var(--clr-border);
    border-radius: 4px;
    background-color: var(--clr-bg-light);
    transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
  }

  #search-input:focus {
    outline: none;
    border-color: var(--clr-primary);
    box-shadow: 0 0 0 3px rgba(153, 0, 0, 0.15);
    background-color: #fff;
  }

  /* ===============================
     Search Results Dropdown
  =============================== */
  .search-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border-top: none;
    z-index: 999;
    max-height: 100px;
    overflow-y: auto;
    margin: 0;
    padding: 0;
    list-style: none;
    box-shadow: 0 4px 6px var(--clr-shadow);
    border-radius: 0 0 6px 6px;
		
		/* Tambahan untuk memendekkan judul */
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
		max-width: 100%; /* atau misal 250px */
	}

  .search-results ul {
    padding: 0;
    margin: 0;
    list-style: none;
  }

  .search-results li {
    display: block;
    width: 100%;
    float: none;
  }

  .search-results li a {
    display: block;
    padding: 0.75rem 1rem;
    color: var(--clr-text);
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid #eee;
    transition: background-color 0.3s;
  }

  .search-results li a:hover {
    background-color: var(--clr-bg-hover);
  }

  .hidden {
    display: none !important;
  }

  /* ===============================
     Navigation + Search Combined
  =============================== */
  .nav-search-combined {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .nav-search-combined nav ul {
    display: flex;
    gap: 5px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .nav-search-combined li {
    display: block;
  }

  .nav-search-combined li a {
    padding: 6px 12px;
    display: block;
    color: black;
    background-color: white;
    text-decoration: none;
    opacity: 1;
    transition: background-color 0.3s, color 0.3s;
  }

  .nav-search-combined li a:hover {
    background-color: maroon;
    color: #fff;
  }
	
	/* ===============================
     Responsive Styles
  =============================== */
  @media (max-width: 768px) {
		.nav-search-combined {
			flex-direction: column;
			align-items: stretch;
			gap: 14px;
			padding: 1rem;
			background-color: #fdfdfd;
			border-top: 1px solid var(--clr-border);
			border-bottom: 1px solid var(--clr-border);
			box-shadow: 0 2px 4px var(--clr-shadow);
			border-radius: 8px;
			transition: all 0.3s ease;
		}

		.searchbar-wrapper {
			max-width: 100%;
			border: 1px solid var(--clr-border);
			border-radius: 6px;
			padding: 4px;
			background-color: #fff;
			box-shadow: 0 1px 2px var(--clr-shadow);
		}

		.nav-search-combined nav ul {
			flex-direction: column;
			gap: 6px;
			width: 100%;
		}

		.nav-search-combined li a {
			width: 100%;
			background-color: #f8f8f8;
			border: 1px solid var(--clr-border);
			border-radius: 5px;
			text-align: center;
			padding: 10px;
			font-weight: 500;
			box-shadow: 0 1px 3px var(--clr-shadow);
			transition: all 0.2s ease;
		}

		.nav-search-combined li a:hover {
			background-color: var(--clr-primary);
			color: #fff;
			transform: translateY(-2px);
		}

		.search-results {
			max-width: 100%;
			font-size: 0.9rem;
			border: 1px solid var(--clr-border);
			border-radius: 4px;
			box-shadow: 0 2px 4px var(--clr-shadow);
		}
	}
</style>
